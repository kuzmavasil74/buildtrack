services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buildtrack
      POSTGRES_PASSWORD: buildtrack
      POSTGRES_DB: buildtrack
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
